    d="M13 5h6v7.2l6.2 12.1A2 2 0 0 1 23.4 27H8.6a2 2 0 0 1-1.8-2.7L13 12.2V5Z"
    fill="none"
    stroke="#4fd1c5"
    stroke-width="1.9"
    stroke-linejoin="round"
  />
  <!-- Liquid, clipped to the flask body. -->
  <path
    d="M10.4 18.6h11.2l3 5.9a2 2 0 0 1-1.8 2.9H9.2a2 2 0 0 1-1.8-2.9l3-5.9Z"
